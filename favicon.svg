<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><defs>

    <!-- Main Blue -->
    <linearGradient id="mainBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"></stop>
      <stop offset="100%" stop-color="#2563EB"></stop>
    </linearGradient>

    <!-- Gold -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"></stop>
      <stop offset="45%" stop-color="#FFD54A"></stop>
      <stop offset="100%" stop-color="#F59E0B"></stop>
    </linearGradient>

    <!-- Card -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"></stop>
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.35"></stop>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#2563EB" flood-opacity="0.18"></feDropShadow>
    </filter>

    <!-- Bolt Glow -->
    <filter id="boltGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

  </defs><circle cx="512" cy="512" r="350" fill="url(#glow)"></circle><rect x="170" y="170" width="684" height="684" rx="170" fill="url(#glass)" filter="url(#shadow)"></rect><rect x="170" y="170" width="684" height="684" rx="170" fill="none" stroke="#D7EEFF" stroke-width="4"></rect><path d="M250 330
           A180 180 0 0 1 430 250" fill="none" stroke="url(#mainBlue)" stroke-width="14" stroke-linecap="round"></path><path d="M774 694
           A180 180 0 0 1 594 774" fill="none" stroke="url(#mainBlue)" stroke-width="14" stroke-linecap="round" opacity="0.8"></path><circle cx="512" cy="512" r="220" fill="none" stroke="#C8EBFF" stroke-width="5" stroke-dasharray="12 18"></circle><circle cx="512" cy="512" r="175" fill="#FFFFFF" filter="url(#shadow)"></circle><circle cx="512" cy="512" r="150" fill="none" stroke="#BAE6FD" stroke-width="5"></circle><path d="M560 215
       L375 535
       H490
       L438 808
       L648 475
       H535
       L560 215Z" fill="url(#gold)" stroke="#FFF4B5" stroke-width="5" stroke-linejoin="round" filter="url(#boltGlow)"></path><path d="M545 265
